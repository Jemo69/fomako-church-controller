name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers
      - run: cargo build --release
      - run: mkdir -p dist && cp target/release/fomako-church-controller dist/fomako-church-controller-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/fomako-church-controller-linux-x64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: mkdir dist; Copy-Item target/release/fomako-church-controller.exe dist/fomako-church-controller-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/fomako-church-controller-windows-x64.exe

  mac:
    strategy:
      matrix:
        runner: [macos-14, macos-15]
        # macos-14 = arm64 (M1+), macos-15 = arm64; add macos-13 for x64 if needed
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release
      - run: mkdir -p dist && cp target/release/fomako-church-controller dist/fomako-church-controller-mac-$(uname -m)
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/fomako-church-controller-mac-*

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  web:
    # Phone + desktop browsers (Android/iPhone path: pair with scripts/visca-relay.py --https).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: |
          VER="$(grep -A2 'name = "wasm-bindgen"' Cargo.lock | head -n 3 | grep version | head -n 1 | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$VER" --locked
      - run: ./scripts/build-web.sh dist/web
      - run: mkdir -p dist/web-release && cp -r dist/web/* dist/web-release/ && cp scripts/visca-relay.py dist/web-release/ && cd dist && zip -r -q fomako-church-controller-web.zip web-release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/fomako-church-controller-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Ensure Android NDK 28 & SDK 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/fomako-church-controller-android.apk

  release:
    needs: [linux, windows, mac, test, web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cd release-assets && sha256sum * > SHA256SUMS && ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
