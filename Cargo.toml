[package]
name = "fomako-church-controller"
version = "0.1.0"
edition = "2021"
description = "FoMaKo PTZ church camera controller - pan/tilt/zoom, presets, image settings, picture edit"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4a072bb06d1b410989f444caf0c9095b8596a565" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "4a072bb06d1b410989f444caf0c9095b8596a565" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4a072bb06d1b410989f444caf0c9095b8596a565" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4a072bb06d1b410989f444caf0c9095b8596a565" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4a072bb06d1b410989f444caf0c9095b8596a565" }

[profile.release]
opt-level = 2
